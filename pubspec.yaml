name: buklin
description: On-demand equipment and transport work requests.
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  geolocator: ^14.0.0
  url_launcher: ^6.3.0
  flutter_map: ^8.2.0
  latlong2: ^0.9.1
  onesignal_flutter: ^5.3.0
  shared_preferences: ^2.5.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/buklin-logo.png
    - assets/grapple.png
    - assets/pickup.png
    - assets/truck.png
    - assets/loading-dyna.png
    - assets/loading-trailer.png
    - assets/loading-store.png
